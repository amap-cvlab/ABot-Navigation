[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abotn-bench"
version = "0.1.0"
description = "ABotN-PointBench & ABotN-POIBench: Evaluation Benchmarks for Visual Navigation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "Pillow>=9.0.0",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
    "pyyaml>=6.0",
    "opencv-python>=4.6.0",
]

[project.optional-dependencies]
gs-server = [
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "plyfile>=0.9",
    "torch>=1.12.0",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["abotn_evaluator*"]
